# HTTPS/HTTP host for cirl.duckdns.org — include bots HMI.
# Requires DuckDNS A record: cirl.duckdns.org -> 212.73.150.149
server {
    listen 80;
    server_name cirl.duckdns.org;

    include /etc/nginx/snippets/cirl.conf;
    include /etc/nginx/snippets/bots-hmi.conf;

    location / {
        return 404;
    }
}
