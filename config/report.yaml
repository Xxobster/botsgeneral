# Phone-friendly report settings (copy to /etc/botsgeneral/report.yaml on VPS)
# Change since_date anytime — no code deploy needed.
# Date-only is UTC midnight. Use YYYY-MM-DDTHH:MM:SSZ to drop same-day leftover closes.

since_date: "2026-07-09"   # YYYY-MM-DD — default PnL / trades start (UTC)

