    ETHUSDT: "2026-08-10"
    SOLUSDT: "2026-08-10"
  llm2_pivot_sol_geo:
    SOLUSDT: "2026-08-12"
  llm2_pivot_eth_ctrl:
    ETHUSDT: "2026-08-12"
