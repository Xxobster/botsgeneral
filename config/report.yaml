# since_by_bot:
#   xgb:
#     BTCUSDT: "2026-07-21"
#     ETHUSDT: "2026-07-23"
#   tsm_vpa:
#     VETUSDT: "2026-07-25"
since_by_bot:
  xgb_match:
    BTCUSDT: "2026-07-25"
    ETHUSDT: "2026-07-25"
  tsm_chandelier:
