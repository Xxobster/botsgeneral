# Bot install locations and how to discover candle demand.
# Edit this only when adding a NEW bot project to a VPS — not when adding coins.

discovery_interval_sec: 60
default_db_path: /var/lib/botsgeneral/shared_candles.db
# 0 = fetch maximum history available from the exchange (paginate until empty)
history_bars: 0
# bump to force a full re-backfill on next collector start
history_schema: "4"

# Hostname / IP → which bot entries apply (collector uses BOTSGENERAL_VPS or auto-detect)
vps:
  "94.156.189.76":
    bots: [xgb, xgb_match, tsm_vpa]
  "212.73.150.178":
    bots: [divergences, crypthor2, karmaa_mp, news]
  "185.203.119.52":
    # 3 account groups (Xxobster9/10/11) share the same Binance 1h pairs via collector
    bots: [ld, xgb, xgb_match]

bots:
  news:
    serve_candles: true
    exchange: binance
    account: Xxobster6
    path: /home/crypto_alpha
    parser: news_yaml
    process_match: ["crypto_alpha", "run_live_bybit"]
    screen_match: ["crypto_alpha"]

  xgb:
    serve_candles: false
    exchange: binance
    account: Xxobster2
    symbols:
      - BTCUSDT
      - ETHUSDT
    path: /home/xgb
    parser: none
    # Prefer .py so we do not also match vps_run_asset_live_match.py
    process_match: ["vps_run_asset_live.py"]
    screen_match: ["xxobster2"]

  # Match-parity xgb deploy (separate tree + Bybit account)
  xgb_match:
    serve_candles: false
    exchange: binance
    account: Xxobster13
    symbols:
      - BTCUSDT
      - ETHUSDT
    path: /home/xgb_match
    parser: none
    process_match: ["vps_run_asset_live_match.py"]
    screen_match: ["xxobster13"]

  # Liquidity / LD live — 3 account groups share Binance USD-M 1h for BTC/ETH/SOL/BNB
  # Symbol bots (Xxobster9 systemd) + script default 10 + crosspair 11 all read shared DB
  ld:
    serve_candles: true
    exchange: binance
    account: [Xxobster9, Xxobster10, Xxobster11]
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
    timeframe: 1h
    # HTF features resample from 1h; keep 1h as the served series
    path: /home/ld
    parser: none
    process_match: ["run_ld_live_symbol.py", "run_ld_live_crosspair.py"]
    systemd_match: ["ld-live@", "ld-live-crosspair"]
    screen_match: ["ld"]

  divergences:
    serve_candles: true
    exchange: bybit
    # Xxobster3: BTC 4h conf + ETH 1h continuation; Xxobster6: ETH 1h confluence (same pair, separate account)
    account: [Xxobster3, Xxobster6]
    path: /opt/divergences
    parser: divergences_launch
    process_match: ["run_live", "divergences"]
    screen_match: ["bybit_"]

  crypthor2:
    serve_candles: true
    exchange: bybit
    account: Xxobster4
    path: /opt/crypthor
    parser: crypthor_services
    # Native 1h/4h for MTF indicators (plus 5m source)
    also_fetch_timeframes: ["1h", "4h"]
    process_match: ["run_live_bot", "crypthor"]
    systemd_prefix: crypthor-
    screen_match: ["crypthor"]

  karmaa_mp:
    serve_candles: true
    exchange: bybit
    account: Xxobster5
    path: /root/karmaa_mp
    parser: karmaa_config
    # Native 1h/4h for ltf/mtf/adx (plus 5m source)
    also_fetch_timeframes: ["1h", "4h"]
    process_match: ["run_live_bot", "karmaa"]
    screen_match: ["Xxobster5", "karmaa"]
    systemd_match: ["karmaa-mp-live"]

  tsm_vpa:
    serve_candles: true
    exchange: bybit
    # Live pack + systemd use Xxobster5 (not bare Xxobster)
    account: Xxobster5
    path: /opt/tsm-vpa
    parser: tsm_vpa_pack
    symbols:
      - VETUSDT
      - SOLUSDT
      - XLMUSDT
      - XRPUSDT
    process_match: ["tsm-vpa", "vpa.live"]
    systemd_prefix: "tsm-vpa@"
    screen_match: ["tsm-vpa"]
    systemd_match: ["tsm-vpa@"]