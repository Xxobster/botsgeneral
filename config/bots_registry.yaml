    account: [Xxobster3, Xxobster6]
    path: /opt/divergences
    min_history_bars: 2000
    parser: divergences_launch
    process_match: ["run_live", "divergences"]
    screen_match: ["bybit_"]

  crypthor2:
    # Strategy id on disk is *mp_oos (Market Profile out-of-sample), not the folder name.
    label: mp_oos
    serve_candles: true
    exchange: bybit
    account: Xxobster4
    path: /opt/crypthor
    parser: crypthor_services
    # Native 1h/4h for MTF indicators (plus 5m source)
    min_history_bars: 5000
    min_history_bars_by_tf: { "5m": 5000, "1h": 2000, "4h": 500 }
    also_fetch_timeframes: ["1h", "4h"]
    process_match: ["run_live_bot", "crypthor"]
    systemd_prefix: crypthor-
    screen_match: ["crypthor"]

