# Bot install locations and how to discover candle demand.
# Edit this only when adding a NEW bot project to a VPS — not when adding coins.

discovery_interval_sec: 60
default_db_path: /var/lib/botsgeneral/shared_candles.db
# 0 = fetch maximum history available from the exchange (paginate until empty)
history_bars: 0
# bump to force a full re-backfill on next collector start
# "6" = Binance shared fetch baked onto market_data.fetch_binance (closed-bar OHLC identity)
history_schema: "6"

# Hostname / IP → which bot entries apply (collector uses BOTSGENERAL_VPS or auto-detect)
vps:
  "94.156.189.76":
    # Per-unit pivot paths (not the stale /home/llm2 catch-all).
    # xgb / Xxobster2 removed 2026-08-25; xgb_match removed 2026-09-06; tsm_vpa (Xxobster5) stopped 2026-10-22.
    bots: [llm2_pivot_sol_geo, llm2_pivot_eth_ctrl, tsm_chandelier, llm2_ema_sol_1h, llm2_hilbert_sol_1h]
  "212.73.150.178":
    # divergences / crypthor2(mp_oos) / karmaa_mp / news removed 2026-09-06; quad / fvg stopped 2026-09-09;
    # 11 EMA min-size probes (Xxobster11) added 2026-10-07.
    bots: [llm2, llm2_autonomy_376_sol, llm2_autonomy_705_eth, llm2_autonomy_013_sol, llm2_pivot_sol_geo, llm2_pivot_eth_ctrl, llm2_pivot_eth_p50, llm2_pivot_sol_p50, llm2_ema_btc_1h, llm2_ema_eth_1h, llm2_ema_bnb_1h, llm2_ema_xrp_1h, llm2_ema_ada_1h, llm2_ema_doge_1h, llm2_ema_avax_1h, llm2_ema_link_1h, llm2_ema_dot_1h, llm2_ema_trx_1h, llm2_ema_xlm_1h]
  "185.203.119.52":
    # llm2 catch-all removed 2026-09-06 (no live units left on this host).
    bots: []
  "212.73.150.149":
    # Human-Machine Interface hub only (no live trading units)
    bots: []
  local:
    # Windows research machine — live-pack scan, not a live trading host
    bots: [llm2, tsm_chandelier, tsm_vpa]

bots:
  # LLM2 — structure candles from Binance futures Last (research parity)
  llm2:
    serve_candles: true
    exchange: binance
    # Runtime report uses --account from live units; keep registry list to live accounts only.
    account: [Xxobster7, Xxobster8, Xxobster9]
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
    # Running pivot packs are 15m. Touch / LIVE-DATA-001 also needs 1m tips.
    timeframe: 15m
    min_history_bars: 3000
    also_fetch_timeframes: [1m]
    min_history_bars_by_tf:
      15m: 3000
      1m: 500
    path: /home/llm2
    path_local: D:/projects/LLM2
    local_pack_roots:
      - D:/projects/LLM2/artifacts/live_packs/pivot_sol_geo_tp1_sl1_p75_w4
      - D:/projects/LLM2/artifacts/live_packs/pivot_eth_p75_ctrl_atr_w4
      - D:/projects/LLM2/artifacts/live_packs/pivot_eth_p50_tp05_sl05_w4
      - D:/projects/LLM2/artifacts/live_packs/pivot_sol_p50_tp05_sl05_w4
    parser: none
    process_match: ["micro_runner", "llm2.live", "structure_v1"]
    screen_match: ["llm2"]
    systemd_match: ["llm2-"]

  # Live pivot units on 94.156.189.76 / Xxobster7 — real install trees (path_ok).
  llm2_pivot_sol_geo:
    serve_candles: true
    exchange: binance
    account: [Xxobster7, Xxobster8]
    symbols: [SOLUSDT]
    timeframe: 15m
    min_history_bars: 3000
    also_fetch_timeframes: [1m]
    min_history_bars_by_tf:
      15m: 3000
      1m: 500
    path: /opt/llm2-pivot-sol-geo-p75-w4
    parser: none
    process_match: ["--pack /opt/llm2-pivot-sol-geo-p75-w4/pack"]
    systemd_match: ["llm2-pivot-sol-geo-p75-w4"]
    screen_match: ["llm2-pivot-sol-geo-p75-w4"]
    notes: "SOL 15m pivot geo p75 w4; Xxobster7; Binance signal / Bybit exec"

  llm2_pivot_eth_ctrl:
