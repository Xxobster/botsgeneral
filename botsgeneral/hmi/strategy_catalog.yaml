# Static strategy catalog for the bots Human-Machine Interface (HMI).
# Summaries are from C:/projects and D:/projects live/research docs. Not live-readiness claims.

families:
  llm2:
    title: Large Language Model 2 (LLM2) live packs
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Structure and formula packs from D:/projects/LLM2. Signals use Binance
      USD-M Last candles (shared collector). Orders execute on Bybit USDT linear
      perpetuals. Typical live size is 5% of equity at the bar stop, floored to
      the venue minimum, leverage about 13× from a 3% stop cap. Many units are
      Post-Only fill tests, not Shadow-Ready.
    rules:
      - Close-based decision on the pack timeframe (15-minute pivot or 1-hour formula).
      - Limit / Post-Only entry when the pack says LIMIT; skip if the limit would cross.
      - Protective stop and take-profit on Bybit after fill.

  tsm_chandelier:
    title: The Secret Mindset chandelier (1-hour)
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Chandelier-stop trend follower from D:/projects/smartmoney (deploy/tsm_chandelier).
      Live on Bitcoin, Ether, Solana 1-hour, account Xxobster6, minimum exchange size.
      Binance Last candles via the shared collector; Bybit execution.
    rules:
      - 1-hour closed bar.
      - Chandelier (Average True Range trail) defines the stop / flip.
      - Isolated USDT perpetual, take-profit / stop-loss on the exchange.

  tsm_vpa:
    title: The Secret Mindset Volume Price Analysis
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Daily effort-versus-result Volume Spread Analysis from D:/projects/TSM-VPA
      and D:/projects/smartmoney. Nested out-of-sample collapsed after the entry-bar
      stop defect was fixed (about 48% of signals stopped on the entry day). Live
      observation is VETUSDT only, minimum size, account Xxobster5.
    rules:
      - Daily closed bar, entry at next open.
      - Stop just beyond the signal-bar extreme; take-profit at a fixed reward:risk.
      - Entry bar is NOT immune — stop/target resolve on the fill bar.

  crypthor:
    title: Market Profile mean-reversion (crypthor2 / mp_oos)
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Long-only Market Profile from C:/projects/crypthor2. Daily TPO value area
      (VAL/VAH/POC) on 5-minute bars; 15-minute signals. Long when the day opens at
      or below VAL, Fibonacci pivot is inside value, 1-hour stochastic turns bullish,
      value area is wide enough, close is below VAH. Optional daily EMA200 regime.
      Exits: partial take-profit 1, optional take-profit 2, final take-profit at
      VAH + 1.8%, percent stop; stop-to-breakeven after take-profit 1.
    rules:
      - Enter next 15-minute open after the signal bar.
      - One trade per calendar day (classic variant).
      - Per-coin configs; never share Bitcoin parameters with Ether.

  karmaa_mp:
    title: Market Profile (karmaa_mp)
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Market Profile live bot from C:/projects/karmaa_mp on account Xxobster5
      (separate from TSM-VPA on the same account family). 5-minute source with
      1-hour / 4-hour context. Bybit USDT perpetual.
    rules:
      - Value-area / profile structure with higher-timeframe filters.
      - Exchange take-profit / stop-loss.

  divergences:
    title: Regular / hidden divergence
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Divergence continuation / confluence from C:/projects/divergences.
      Bitcoin 4-hour confirmation and Ether 1-hour continuation historically on
      Xxobster3; Ether 1-hour confluence on Xxobster6. Bybit candles.
    rules:
      - Divergence between price and oscillator on the configured timeframe.
      - Confirmation / confluence filters before entry.

  news:
    title: News / crypto_alpha
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Event-driven bot from C:/projects/news (crypto_alpha) on Xxobster6.
      Binance Last candles; Bybit execution. Own pull historically; shared
      collector when migrated.
    rules:
      - Headline / event gates then a directional trade with exchange exits.

  xgb:
    title: Extreme Gradient Boosting (retired live)
    readiness: REMOVED
    summary: >
      Tree model live from C:/projects/xgb. Xxobster2 retired 2026-08-25 on
      live-network-1. Match-parity tree (xgb_match / Xxobster13) may still exist
      as a separate tree. Not a current HMI headline bot unless the process is up.

  ld:
    title: Liquidity / LD
    readiness: LIVE_STOP / RESEARCH_ONLY
    summary: >
      Liquidity-direction live from D:/projects/LD. Shared Binance 1-hour Last
      for Bitcoin / Ether / Solana / BNB. Account groups Xxobster9 / 10 / 11.
    rules:
      - 1-hour closed bar; higher-timeframe features resample from 1-hour.

  other:
    title: Other
    summary: See registry notes for this unit.

