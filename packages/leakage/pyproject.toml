[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakage"
version = "1.0.0"
description = "Shared dataset / indicator look-ahead leakage test engine for trading research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
leakage-check = "leakage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["leakage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
