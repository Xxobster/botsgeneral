[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicators"
version = "1.0.0"
description = "Shared price-structure and Fibonacci indicator warehouse for trading research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "market_data",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
refresh = ["market_data[research]"]

[project.scripts]
indicators = "indicators.cli:main"
indicators-update = "indicators.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["indicators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
